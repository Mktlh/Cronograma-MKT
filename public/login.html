<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - Cronograma do Marketing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #000; color: #fff; font-family: "Lexend", "Segoe UI", Arial, sans-serif; padding: 16px;
    }
    .caixa { width: 100%; max-width: 420px; text-align: center; }
    .caixa img { width: 100%; max-width: 380px; height: auto; }
    h1 { font-size: clamp(1.3rem, 5vw, 1.8rem); font-weight: 800; margin: 8px 0 24px; line-height: 1.2; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, button {
      font: inherit; font-size: 16px; min-height: 48px; border-radius: 10px; border: 0; padding: 0 14px;
    }
    input { background: #fff; color: #1f2430; }
    input:focus-visible, button:focus-visible { outline: 3px solid #e0a914; outline-offset: 2px; }
    button { background: #e0a914; color: #000; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(.95); }
    #erro { min-height: 20px; color: #ff6b6b; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <main class="caixa">
    <img src="/public/logo.png" alt="LH Eletrificados - Motos Elétricas">
    <h1>Cronograma do Marketing - LH Eletrificados</h1>

    <form id="form">
      <input id="senha" type="password" placeholder="Digite a senha" autocomplete="current-password" required autofocus>
      <p id="erro" role="alert"></p>
      <button type="submit">Entrar</button>
    </form>
  </main>

  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const erro = document.getElementById("erro");
      erro.textContent = "";
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ senha: document.getElementById("senha").value }),
      });
      if (r.ok) location.href = "/";
      else erro.textContent = "Senha incorreta. Tente novamente.";
    });
  </script>
</body>
</html>
